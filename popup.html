<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>Robots Radar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ══════════════════════════════════════════════════
       THEME TOKENS
       All colours flow from these two blocks only.
    ══════════════════════════════════════════════════ */
    :root, [data-theme="dark"] {
      --bg:          #080b12;
      --bg-header:   #0d1220;
      --bg-footer:   #060810;
      --card:        #0f1420;
      --card2:       #141926;
      --border:      #1e2840;
      --border2:     #263050;
      --text:        #dde4f5;
      --text-sub:    #8898bb;
      --muted:       #5a6a8a;
      --muted2:      #3a4560;
      --blue:        #60a5fa;
      --blue-d:      #1d4ed8;
      --green:       #4ade80;
      --teal:        #34d399;
      --red:         #f87171;
      --yellow:      #fbbf24;
      --code-bg:     #050709;
      --s-agent:     #60a5fa;
      --s-allow:     #4ade80;
      --s-disallow:  #f87171;
      --s-comment:   #3a4d6a;
      --s-key:       #fbbf24;
      --s-sitemap:   #a78bfa;
      --shadow-sm:   0 1px 3px rgba(0,0,0,.4);
      --shadow-glow: 0 0 24px;
      --toggle-track:#1e2840;
      --toggle-thumb:#60a5fa;
      --toggle-icon-dark: "🌙";
      --toggle-icon-light:"☀️";
    }

    [data-theme="light"] {
      --bg:          #f4f6fb;
      --bg-header:   #ffffff;
      --bg-footer:   #eef1f7;
      --card:        #ffffff;
      --card2:       #f0f3fa;
      --border:      #dde3f0;
      --border2:     #c8d0e8;
      --text:        #1a2240;
      --text-sub:    #4a5880;
      --muted:       #8090b0;
      --muted2:      #b0bcd8;
      --blue:        #2563eb;
      --blue-d:      #1d4ed8;
      --green:       #16a34a;
      --teal:        #0d9488;
      --red:         #dc2626;
      --yellow:      #d97706;
      --code-bg:     #f8faff;
      --s-agent:     #2563eb;
      --s-allow:     #16a34a;
      --s-disallow:  #dc2626;
      --s-comment:   #94a3b8;
      --s-key:       #d97706;
      --s-sitemap:   #7c3aed;
      --shadow-sm:   0 1px 4px rgba(0,0,0,.10);
      --shadow-glow: 0 0 20px;
      --toggle-track:#dde3f0;
      --toggle-thumb:#2563eb;
    }

    /* ══ TRANSITIONS ═════════════════════════════════ */
    body, .header, .footer, .stat, .rule-row,
    .viewer-scroll, .error-box, .cache-badge,
    .refresh-btn, .theme-toggle-track {
      transition:
        background .25s ease,
        color       .25s ease,
        border-color .25s ease,
        box-shadow  .25s ease;
    }

    /* ══ BASE ════════════════════════════════════════ */
    body {
      width: 370px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      overflow: hidden;
    }

    /* ══ HEADER ══════════════════════════════════════ */
    .header {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 11px 14px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-header);
      box-shadow: var(--shadow-sm);
    }
    .header-icon {
      font-size: 21px;
      filter: drop-shadow(0 0 5px rgba(96,165,250,.45));
      flex-shrink: 0;
    }
    .header-text { flex: 1; min-width: 0; }
    .header-text h1 { font-size: 13.5px; font-weight: 700; letter-spacing: .3px; }
    .header-text p  { color: var(--muted); font-size: 10px; margin-top: 1px; }

    /* ── cache badge ── */
    .cache-badge {
      font-size: 9px; font-weight: 600;
      padding: 3px 7px; border-radius: 20px;
      border: 1px solid var(--border2);
      color: var(--muted); letter-spacing: .4px;
      text-transform: uppercase; white-space: nowrap;
    }
    .cache-badge.live   { border-color: var(--blue-d); color: var(--blue); }
    .cache-badge.cached { border-color: var(--border2); color: var(--muted); }

    /* ── theme toggle ── */
    .theme-toggle {
      display: flex; align-items: center; gap: 6px;
      cursor: pointer; flex-shrink: 0; user-select: none;
    }
    .theme-toggle-track {
      width: 36px; height: 20px;
      background: var(--toggle-track);
      border-radius: 20px;
      border: 1px solid var(--border2);
      position: relative;
      transition: background .25s;
    }
    .theme-toggle-thumb {
      position: absolute;
      top: 2px; left: 2px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--toggle-thumb);
      transition: transform .25s cubic-bezier(.4,0,.2,1), background .25s;
      box-shadow: 0 1px 3px rgba(0,0,0,.3);
    }
    [data-theme="light"] .theme-toggle-thumb {
      transform: translateX(16px);
    }
    .theme-toggle-icon {
      font-size: 13px; line-height: 1;
      transition: transform .3s;
    }
    [data-theme="light"] .theme-toggle-icon { transform: rotate(180deg); }

    /* ══ HERO STATUS ═════════════════════════════════ */
    .status-hero {
      padding: 16px 14px 13px;
      display: flex; align-items: center; gap: 13px;
      position: relative; overflow: hidden;
    }
    .status-hero::before {
      content: '';
      position: absolute; inset: 0;
      background: var(--hero-bg, transparent);
      opacity: .06;
      pointer-events: none;
    }
    .hero-icon {
      width: 54px; height: 54px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 27px; flex-shrink: 0; position: relative;
      transition: box-shadow .4s, background .25s;
    }
    .hero-icon::after {
      content: '';
      position: absolute; inset: -3px; border-radius: 50%;
      border: 2px solid var(--hero-ring, transparent);
      opacity: .45;
      animation: ring-pulse 2.2s ease-in-out infinite;
    }
    @keyframes ring-pulse {
      0%,100% { transform: scale(1);    opacity: .45; }
      50%      { transform: scale(1.09); opacity: .75; }
    }

    .hero-icon.allowed    { background: rgba(74,222,128,.1);  --hero-ring:var(--green);  --hero-bg:var(--green);  box-shadow: var(--shadow-glow) rgba(74,222,128,.22); }
    .hero-icon.open       { background: rgba(52,211,153,.1);  --hero-ring:var(--teal);   --hero-bg:var(--teal);   box-shadow: var(--shadow-glow) rgba(52,211,153,.22); }
    .hero-icon.disallowed { background: rgba(248,113,113,.1); --hero-ring:var(--red);    --hero-bg:var(--red);    box-shadow: var(--shadow-glow) rgba(248,113,113,.22); }
    .hero-icon.error      { background: rgba(100,116,139,.08);--hero-ring:#64748b; }
    .hero-icon.scanning   {
      background: rgba(96,165,250,.09);
      --hero-ring: var(--blue);
      box-shadow: var(--shadow-glow) rgba(96,165,250,.18);
      animation: scan-pulse 1.5s ease-in-out infinite;
    }
    @keyframes scan-pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

    .hero-info { flex: 1; min-width: 0; }
    .hero-label {
      font-size: 19px; font-weight: 800;
      letter-spacing: -.2px; margin-bottom: 3px;
      transition: color .25s;
    }
    .hero-label.allowed    { color: var(--green); }
    .hero-label.open       { color: var(--teal); }
    .hero-label.disallowed { color: var(--red); }
    .hero-label.error      { color: var(--muted); }
    .hero-label.scanning   { color: var(--blue); animation: blink .9s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

    .hero-path {
      font-family: monospace; font-size: 10.5px;
      color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .hero-host { color: var(--blue); font-weight: 600; }

    /* ══ STATS ═══════════════════════════════════════ */
    .stats {
      display: flex; gap: 6px;
      padding: 0 14px 13px;
    }
    .stat {
      flex: 1; background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 0;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }
    .stat-val   { font-size: 16px; font-weight: 800; }
    .stat-val.g { color: var(--green); }
    .stat-val.r { color: var(--red); }
    .stat-val.b { color: var(--blue); }
    .stat-lbl   {
      font-size: 9px; color: var(--muted);
      text-transform: uppercase; letter-spacing: .6px; margin-top: 2px;
    }

    /* ══ RULE SECTION ════════════════════════════════ */
    .section { padding: 0 14px 12px; }
    .section-title {
      font-size: 9px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1px;
      color: var(--muted2); margin-bottom: 7px;
    }
    .rule-list { display: flex; flex-direction: column; gap: 4px; }
    .rule-row {
      display: flex; flex-direction: column;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 7px; padding: 8px 10px;
      box-shadow: var(--shadow-sm);
    }
    .rule-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .rule-dot.allow    { background: var(--green); box-shadow: 0 0 5px rgba(74,222,128,.5); }
    .rule-dot.disallow { background: var(--red);   box-shadow: 0 0 5px rgba(248,113,113,.5); }
    .rule-path  { font-family: monospace; font-size: 11px; flex: 1; color: var(--text); }
    .empty-rules { color: var(--muted); font-size: 11px; padding: 4px 0; line-height: 1.5; }

    /* specificity bar */
    .spec-bar-wrap {
      flex: 1; height: 4px;
      background: var(--border);
      border-radius: 2px; overflow: hidden;
    }
    .spec-bar { height: 100%; border-radius: 2px; transition: width .5s ease; }
    .spec-bar.allow    { background: var(--green); }
    .spec-bar.disallow { background: var(--red); }

    /* ══ SOURCE VIEWER ═══════════════════════════════ */
    .viewer-header {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 0 14px 6px;
    }
    .toggle-btn {
      background: none; border: none; cursor: pointer;
      font-size: 10px; color: var(--blue);
      display: flex; align-items: center; gap: 3px;
    }
    .toggle-btn:hover { text-decoration: underline; }
    .viewer {
      margin: 0 14px 13px;
      border: 1px solid var(--border);
      border-radius: 8px; overflow: hidden; display: none;
    }
    .viewer.open { display: block; }
    .viewer-scroll {
      max-height: 150px; overflow-y: auto;
      padding: 10px 12px;
      font-family: 'Cascadia Code','Fira Code',monospace;
      font-size: 10.5px; line-height: 1.75;
      white-space: pre-wrap; word-break: break-all;
      background: var(--code-bg);
      color: var(--text);
    }
    .viewer-scroll::-webkit-scrollbar { width: 4px; }
    .viewer-scroll::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

    /* syntax colours — read from CSS vars so theme-aware */
    .s-agent    { color: var(--s-agent);    font-weight: 600; }
    .s-allow    { color: var(--s-allow); }
    .s-disallow { color: var(--s-disallow); }
    .s-comment  { color: var(--s-comment);  font-style: italic; }
    .s-key      { color: var(--s-key); }
    .s-sitemap  { color: var(--s-sitemap); }

    /* ══ FOOTER ══════════════════════════════════════ */
    .footer {
      padding: 9px 14px;
      border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      background: var(--bg-footer);
    }
    .fetch-info { color: var(--muted); font-size: 9.5px; }
    .refresh-btn {
      background: var(--card2); border: 1px solid var(--border2);
      border-radius: 6px; color: var(--text); font-size: 10px;
      cursor: pointer; padding: 4px 10px;
      display: flex; align-items: center; gap: 4px;
    }
    .refresh-btn:hover { background: var(--border); }

    /* ══ ERROR ═══════════════════════════════════════ */
    .error-box {
      margin: 0 14px 13px; padding: 10px 12px;
      border-radius: 8px; font-size: 11px; line-height: 1.5;
      border: 1px solid var(--red); color: var(--red);
      background: rgba(220,38,38,.07);
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-icon">🤖</div>
    <div class="header-text">
      <h1>Robots Radar</h1>
      <p>Live /robots.txt analyser</p>
    </div>

    <div class="cache-badge" id="cacheBadge" style="display:none"></div>

    <!-- Theme toggle -->
    <button class="theme-toggle" id="themeToggle" title="Toggle light / dark mode" aria-label="Toggle theme">
      <span class="theme-toggle-icon" id="themeIcon">🌙</span>
      <div class="theme-toggle-track">
        <div class="theme-toggle-thumb"></div>
      </div>
    </button>
  </div>

  <div class="status-hero" id="statusHero">
    <div class="hero-icon scanning" id="heroIcon">📡</div>
    <div class="hero-info">
      <div class="hero-label scanning" id="heroLabel">Scanning…</div>
      <div class="hero-path" id="heroPath">Fetching robots.txt</div>
    </div>
  </div>

  <div class="stats" id="statsRow" style="display:none">
    <div class="stat">
      <div class="stat-val g" id="statAllow">—</div>
      <div class="stat-lbl">Allow</div>
    </div>
    <div class="stat">
      <div class="stat-val r" id="statDisallow">—</div>
      <div class="stat-lbl">Disallow</div>
    </div>
    <div class="stat">
      <div class="stat-val b" id="statAgents">—</div>
      <div class="stat-lbl">Agents</div>
    </div>
  </div>

  <div class="section" id="ruleSection" style="display:none">
    <div class="section-title">Applied Rule</div>
    <div class="rule-list" id="ruleList"></div>
  </div>

  <div class="error-box" id="errorBox" style="display:none"></div>

  <div class="viewer-header" id="viewerHeader" style="display:none">
    <span class="section-title" style="margin:0">robots.txt source</span>
    <button class="toggle-btn" id="toggleBtn">Show source ▾</button>
  </div>
  <div class="viewer" id="viewer">
    <div class="viewer-scroll" id="viewerContent"></div>
  </div>

  <div class="footer">
    <span class="fetch-info" id="fetchInfo">—</span>
    <button class="refresh-btn" id="refreshBtn">↺ Refresh</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
